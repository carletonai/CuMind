name: CI

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Install dependencies
      run: uv sync

  #    Ambiguous reporting
  #  - name: Run linting
  #    run: uv run ruff check .
  
  #    Too slow
  #  - name: Run type checking
  #    run: uv run mypy src/

    - name: Run type checking
      run: uv run ty check .

    - name: Run tests
      run: uv run pytest

